<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake Nova</title>
<style>
:root{
  --bg1:#111827; --bg2:#0b1020; --card:rgba(255,255,255,.07);
  --card2:rgba(255,255,255,.11); --text:#f7f9ff; --muted:#aeb7cc;
  --green:#54e38e; --green2:#22c55e; --red:#ff5f72; --accent:#7c8cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; overflow-x:hidden; color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 20% 10%,#26345d 0%,transparent 35%),
             radial-gradient(circle at 90% 80%,#173d38 0%,transparent 32%),
             linear-gradient(145deg,var(--bg1),var(--bg2));
  display:flex; justify-content:center; padding:18px 12px 35px;
}
.app{width:min(100%,620px); text-align:center}
.header{display:flex;justify-content:space-between;align-items:center;margin:5px 4px 18px}
.brand{text-align:left}
.brand h1{margin:0;font-size:clamp(26px,7vw,40px);letter-spacing:-1px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.icon-btn{
  width:46px;height:46px;border:1px solid rgba(255,255,255,.12);border-radius:16px;
  background:var(--card);color:white;font-size:20px;cursor:pointer;
  backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.15)
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{
  background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:18px;
  padding:11px 6px;backdrop-filter:blur(14px)
}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.game-card{
  position:relative;padding:10px;border-radius:28px;background:var(--card);
  border:1px solid rgba(255,255,255,.11);box-shadow:0 25px 70px rgba(0,0,0,.3);
  backdrop-filter:blur(18px)
}
canvas{
  width:100%;aspect-ratio:1/1;display:block;border-radius:21px;
  background:linear-gradient(145deg,#0a1020,#0b1424);
  touch-action:none
}
.overlay{
  position:absolute;inset:10px;border-radius:21px;display:flex;align-items:center;justify-content:center;
  background:rgba(7,11,22,.48);backdrop-filter:blur(6px);opacity:0;pointer-events:none;
  transition:.25s ease
}
.overlay.show{opacity:1;pointer-events:auto}
.panel{
  width:min(82%,360px);padding:26px 20px;border-radius:25px;background:rgba(24,32,54,.88);
  border:1px solid rgba(255,255,255,.15);box-shadow:0 20px 60px rgba(0,0,0,.35)
}
.panel h2{margin:0 0 8px;font-size:28px}.panel p{margin:0 0 18px;color:var(--muted)}
.primary,.secondary{
  border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:15px;cursor:pointer;color:white
}
.primary{background:linear-gradient(135deg,#35d978,#16a34a);box-shadow:0 10px 25px rgba(34,197,94,.25)}
.secondary{background:var(--card2);border:1px solid rgba(255,255,255,.12)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1}
.controls{
  margin:18px auto 0;width:210px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.ctrl{
  height:58px;border-radius:18px;border:1px solid rgba(255,255,255,.13);
  background:var(--card);color:white;font-size:24px;cursor:pointer;backdrop-filter:blur(12px);
  box-shadow:0 8px 22px rgba(0,0,0,.16);transition:transform .1s
}
.ctrl:active,.icon-btn:active{transform:scale(.94)}
.up{grid-column:2}.down{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}
.bottom-row{display:flex;gap:10px;margin:18px 2px 0}
.bottom-row button{flex:1}
.settings{
  margin-top:15px;text-align:left;background:var(--card);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:15px;display:none
}
.settings.show{display:block}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
select{
  color:white;background:#1b2740;border:1px solid rgba(255,255,255,.15);padding:9px 12px;border-radius:12px
}
.hint{color:var(--muted);font-size:12px;margin:15px 5px 0}
@media(max-width:390px){.app{padding:0}.ctrl{height:54px}.stats{gap:7px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <h1>🐍 Snake Nova</h1>
      <p>Smooth • Fast • Mobile Friendly</p>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>Score</span></div>
    <div class="stat"><b id="high">0</b><span>Best</span></div>
    <div class="stat"><b id="level">1</b><span>Level</span></div>
  </div>

  <div class="settings" id="settings">
    <div class="setting-row">
      <span>Speed</span>
      <select id="speedSelect">
        <option value="slow">Relaxed</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Fast</option>
      </select>
    </div>
    <div class="setting-row">
      <span>Sound</span>
      <button class="secondary" id="soundBtn">ON 🔊</button>
    </div>
  </div>

  <div class="game-card">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="overlay show" id="overlay">
      <div class="panel">
        <h2 id="overlayTitle">Ready?</h2>
        <p id="overlayText">Swipe or use the buttons to control the snake.</p>
        <button class="primary" id="mainButton">Start Game</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl up" data-dir="up">▲</button>
    <button class="ctrl left" data-dir="left">◀</button>
    <button class="ctrl down" data-dir="down">▼</button>
    <button class="ctrl right" data-dir="right">▶</button>
  </div>

  <div class="bottom-row">
    <button class="secondary" id="pauseBtn">⏸ Pause</button>
    <button class="secondary" id="restartBtn">↻ Restart</button>
  </div>
  <div class="hint">🎮 Arrow keys • Swipe on the board • Buttons • Eat the glowing food</div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),levelEl=document.getElementById('level');
const overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText');
const mainButton=document.getElementById('mainButton'),pauseBtn=document.getElementById('pauseBtn');
const settings=document.getElementById('settings'),speedSelect=document.getElementById('speedSelect'),soundBtn=document.getElementById('soundBtn');

const GRID=24, CELL=canvas.width/GRID;
let snake,food,dir,nextDir,score,high=+localStorage.getItem('snakeNovaBest')||0;
let running=false,paused=false,lastTime=0,acc=0,soundOn=true;
let touchStart=null;
highEl.textContent=high;

const speeds={slow:145,normal:105,fast:72};
function reset(){
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}];
  dir='right';nextDir='right';score=0;scoreEl.textContent=0;levelEl.textContent=1;
  food=randomFood();acc=0;lastTime=0;paused=false;pauseBtn.textContent='⏸ Pause';
  draw();
}
function randomFood(){
  let f;
  do{f={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}}while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}
function changeDirection(d){
  const opposite={up:'down',down:'up',left:'right',right:'left'};
  if(opposite[d]!==dir) nextDir=d;
}
function tick(){
  dir=nextDir;
  const h={...snake[0]};
  if(dir==='up')h.y--; if(dir==='down')h.y++; if(dir==='left')h.x--; if(dir==='right')h.x++;
  const hitWall=h.x<0||h.y<0||h.x>=GRID||h.y>=GRID;
  const hitSelf=snake.some(s=>s.x===h.x&&s.y===h.y);
  if(hitWall||hitSelf){gameOver();return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;scoreEl.textContent=score;
    levelEl.textContent=1+Math.floor(score/5);
    if(score>high){high=score;highEl.textContent=high;localStorage.setItem('snakeNovaBest',high)}
    food=randomFood();beep(700,0.06);
  }else snake.pop();
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // subtle grid
  ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=1;
  for(let i=1;i<GRID;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke()}
  // food glow
  const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;
  const glow=ctx.createRadialGradient(fx,fy,2,fx,fy,CELL);
  glow.addColorStop(0,'rgba(255,100,120,.85)');glow.addColorStop(1,'rgba(255,80,100,0)');
  ctx.fillStyle=glow;ctx.fillRect(food.x*CELL,food.y*CELL,CELL,CELL);
  ctx.fillStyle='#ff5f72';roundRect(food.x*CELL+CELL*.2,food.y*CELL+CELL*.2,CELL*.6,CELL*.6,CELL*.25);ctx.fill();
  snake.forEach((s,i)=>{
    const x=s.x*CELL+2,y=s.y*CELL+2,w=CELL-4;
    ctx.fillStyle=i===0?'#78f5a2':'#35c978';
    if(i===0){ctx.shadowColor='#54e38e';ctx.shadowBlur=18}
    roundRect(x,y,w,w,7);ctx.fill();ctx.shadowBlur=0;
    if(i===0){
      ctx.fillStyle='#102b1b';
      const ex=x+w*.68,ey=y+w*.3;
      ctx.beginPath();ctx.arc(ex,ey,w*.08,0,Math.PI*2);ctx.fill();
    }
  });
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function loop(t){
  if(!running)return;
  if(!paused){
    if(!lastTime)lastTime=t;
    acc+=t-lastTime;lastTime=t;
    const interval=Math.max(45,speeds[speedSelect.value]-(Math.floor(score/5)*5));
    while(acc>=interval){tick();acc-=interval;if(!running)break}
    draw();
  }else lastTime=t;
  requestAnimationFrame(loop);
}
function start(){
  reset();running=true;overlay.classList.remove('show');requestAnimationFrame(loop);
}
function gameOver(){
  running=false;beep(150,0.2);
  overlayTitle.textContent='Game Over!';
  overlayText.textContent=`Score: ${score} • Best: ${high}`;
  mainButton.textContent='Play Again';
  overlay.classList.add('show');
}
function togglePause(){
  if(!running)return;
  paused=!paused;pauseBtn.textContent=paused?'▶ Resume':'⏸ Pause';
}
function beep(freq,duration){
  if(!soundOn)return;
  try{
    const A=window.AudioContext||window.webkitAudioContext;const a=new A(),o=a.createOscillator(),g=a.createGain();
    o.frequency.value=freq;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+duration);
  }catch(e){}
}
mainButton.onclick=start;
pauseBtn.onclick=togglePause;
document.getElementById('restartBtn').onclick=()=>{running=false;start()};
document.getElementById('settingsBtn').onclick=()=>settings.classList.toggle('show');
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'ON 🔊':'OFF 🔇'};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>changeDirection(b.dataset.dir));
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){e.preventDefault();changeDirection(m[e.key])}
  if(e.key===' ')togglePause();
});
canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>25){if(Math.abs(dx)>Math.abs(dy))changeDirection(dx>0?'right':'left');else changeDirection(dy>0?'down':'up')}
  touchStart=null;
},{passive:true});
reset();
</script>
</body>
</html>
