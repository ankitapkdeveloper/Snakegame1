<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 15px;
    }
    h1 { margin: 0 0 10px; }
    .score { font-size: 20px; margin-bottom: 12px; }
    canvas {
      background: #222;
      border: 3px solid #fff;
      max-width: 100%;
      touch-action: none;
    }
    .controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 65px);
      gap: 8px;
    }
    button {
      height: 55px;
      border: none;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
    }
    .up { grid-column: 2; }
    .restart {
      margin-top: 15px;
      padding: 10px 25px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>🐍 Snake Game</h1>
  <div class="score">Score: <span id="score">0</span></div>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="controls">
    <button class="up" onclick="changeDirection('UP')">⬆️</button>
    <button onclick="changeDirection('LEFT')">⬅️</button>
    <button onclick="changeDirection('DOWN')">⬇️</button>
    <button onclick="changeDirection('RIGHT')">➡️</button>
  </div>

  <button class="restart" onclick="restartGame()">Restart Game</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const box = 20;
    const size = canvas.width / box;

    let snake, food, direction, nextDirection, score, game;

    function startGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = "RIGHT";
      nextDirection = "RIGHT";
      score = 0;
      scoreElement.textContent = score;
      food = randomFood();

      clearInterval(game);
      game = setInterval(drawGame, 120);
    }

    function randomFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * size),
          y: Math.floor(Math.random() * size)
        };
      } while (snake.some(part => part.x === newFood.x && part.y === newFood.y));
      return newFood;
    }

    function changeDirection(newDirection) {
      const opposites = {
        UP: "DOWN",
        DOWN: "UP",
        LEFT: "RIGHT",
        RIGHT: "LEFT"
      };

      if (opposites[newDirection] !== direction) {
        nextDirection = newDirection;
      }
    }

    document.addEventListener("keydown", (event) => {
      const keys = {
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT"
      };

      if (keys[event.key]) {
        event.preventDefault();
        changeDirection(keys[event.key]);
      }
    });

    function drawGame() {
      direction = nextDirection;

      const head = { ...snake[0] };

      if (direction === "UP") head.y--;
      if (direction === "DOWN") head.y++;
      if (direction === "LEFT") head.x--;
      if (direction === "RIGHT") head.x++;

      const hitWall =
        head.x < 0 ||
        head.y < 0 ||
        head.x >= size ||
        head.y >= size;

      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);

      if (hitWall || hitSelf) {
        clearInterval(game);
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2);
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreElement.textContent = score;
        food = randomFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Food
      ctx.fillStyle = "red";
      ctx.fillRect(food.x * box + 2, food.y * box + 2, box - 4, box - 4);

      // Snake
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#00ff00" : "#00aa00";
        ctx.fillRect(part.x * box + 1, part.y * box + 1, box - 2, box - 2);
      });
    }

    function restartGame() {
      startGame();
    }

    // Swipe controls for mobile
    let startX = 0;
    let startY = 0;

    canvas.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;
    });

    canvas.addEventListener("touchend", (e) => {
      const touch = e.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 20) changeDirection("RIGHT");
        else if (dx < -20) changeDirection("LEFT");
      } else {
        if (dy > 20) changeDirection("DOWN");
        else if (dy < -20) changeDirection("UP");
      }
    });

    startGame();
  </script>

</body>
</html>
